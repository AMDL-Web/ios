name: TestFlight Beta

# 发版入口(二选一),与后端 release.yml 的约定保持一致:
#   - pull_request closed:dev -> main 的 PR 被合并时自动发版。版本号优先从
#     PR 标题解析(形如 "Release v1.2.0: ..."),标题里没有版本号时回退到工程
#     里的 MARKETING_VERSION,不会因此失败——iOS 的版本号本来就以工程设置为准。
#   - workflow_dispatch:手动指定版本号发版,兜底路径。
#
# 流程:归档(archive)-> 导出 ipa -> 上传 App Store Connect -> 打 tag。
# 上传成功后 TestFlight「内部测试」组的成员在构建处理完(通常几分钟到半小时)
# 会自动收到,内部测试不需要 Beta 审核;外部测试组才需要提交审核。
#
# 需要的仓库 secret(缺任意一个都会在第一步明确报错):
#   APPSTORE_ISSUER_ID       App Store Connect API 的 Issuer ID(UUID)
#   APPSTORE_KEY_ID          API 密钥的 Key ID
#   APPSTORE_PRIVATE_KEY     API 密钥 .p8 文件的完整内容
#   BUILD_CERTIFICATE_BASE64 Apple Distribution 证书 .p12 的 base64
#   P12_PASSWORD             上述 .p12 的密码
#   KEYCHAIN_PASSWORD        runner 上临时钥匙串的密码(任意自定字符串)

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0),留空则用工程里的 MARKETING_VERSION'
        required: false
        type: string

permissions:
  contents: write

jobs:
  testflight:
    name: Build and upload to TestFlight
    # 手动触发总是运行;PR 事件只在「来自 dev 且真的被合并」时运行,
    # 直接 close 不合并、或从其他分支合入 main 的 PR 都不发版。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: macos-latest
    env:
      PROJECT: amdl-ios.xcodeproj
      SCHEME: amdl-ios

    steps:
      - name: Verify required secrets
        # 先集中检查,避免跑完十几分钟的归档才发现缺 secret。
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          MISSING=""
          for name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY \
                      BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then MISSING="$MISSING $name"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::缺少发版所需的仓库 secret:$MISSING。参见 CONTRIBUTING.md 的 TestFlight 发版小节。"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PR 合并触发时检出合并进 main 的那个提交;手动触发时用所选 ref。
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Resolve version and build number
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # 工程里的 MARKETING_VERSION 是版本号的事实来源。
          PROJECT_VERSION=$(grep -m1 -o 'MARKETING_VERSION = [^;]*;' "$PROJECT/project.pbxproj" \
            | sed 's/MARKETING_VERSION = //; s/;//' | tr -d ' ')

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(printf '%s' "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1 | sed 's/^v//' || true)
            if [ -z "$VERSION" ]; then
              VERSION="$PROJECT_VERSION"
              echo "PR 标题里没有版本号,使用工程内的 MARKETING_VERSION: $VERSION"
            fi
          fi

          # 构建号必须在同一版本号下唯一且递增,否则 App Store Connect 会拒收。
          # run_number 由 GitHub 单调递增维护,天然满足。
          BUILD_NUMBER="${{ github.run_number }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "发布版本: $VERSION (build $BUILD_NUMBER)"

      - name: Install Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          # 建一个临时钥匙串并设为默认，避免污染 runner 的登录钥匙串。
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # 允许 codesign 非交互访问私钥，否则归档时会卡在 UI 授权弹窗上。
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "已导入的签名身份:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # altool / xcodebuild 会在这些固定位置查找密钥文件。
          mkdir -p ~/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Set version and build number
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          # 直接改工程设置，不落地成提交——发版产物的版本号由 CI 决定。
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "$BUILD"

      - name: Archive
        run: |
          set -o pipefail
          # 归档阶段不签名。Xcode 的自动签名在归档时固定使用「开发」身份
          # （分发签名本来就发生在导出/重签阶段），所以 runner 上只有分发证书
          # 时，无论用自动身份还是硬指定 Apple Distribution 都会失败：
          #   前者报 "No signing certificate iOS Development found"
          #   后者报 "conflicting provisioning settings"
          # 关掉归档签名后，由下面的 -exportArchive 用分发证书完成签名，
          # 这样整条链只需要一张分发证书。
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/amdl-ios.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export ipa
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/amdl-ios.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -n1)
          if [ -z "$IPA" ]; then
            echo "::error::导出目录里没有找到 ipa"
            exit 1
          fi
          echo "上传: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload build artifacts
        # 上传失败时也保留产物，便于本地复现或手动用 Transporter 上传。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 14

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          TAG="v${VERSION}+${BUILD}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在，跳过打标签。"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "已打标签 $TAG"

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/private_keys
