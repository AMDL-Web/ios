name: Claude Auto Review

# 自动 PR 审查开关：仓库变量 CLAUDE_AUTO_REVIEW
# - 未设置或设为其他值：开启（默认开）
# - 设为 "false"：关闭
# 修改方式：Settings → Secrets and variables → Actions → Variables，
# 或命令行：gh variable set CLAUDE_AUTO_REVIEW --body false
#
# 依赖仓库 secret：CLAUDE_CODE_OAUTH_TOKEN。

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  auto-review:
    if: vars.CLAUDE_AUTO_REVIEW != 'false' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress 会创建一条追踪评论，展示审查进度与最终结论，
          # 并在重复运行时复用同一条评论。
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            请审查这个 pull request，重点关注（这是一个 Swift 6 / SwiftUI iOS 项目）：
            - 正确性问题和潜在 bug（并发、错误处理、边界条件、可选值解包）
            - Swift 6 并发安全：actor 隔离、Sendable、MainActor 使用是否正确，
              是否用 @unchecked Sendable / nonisolated(unsafe) / @preconcurrency
              仅仅为了压掉诊断（参考 AGENTS.md 的并发规则）
            - 与仓库现有架构和模式的一致性（参考 AGENTS.md）
            - 是否把主线程/UI 状态错误地移出 MainActor，或引入了不必要的
              非结构化 Task
            - 是否遵守提交规范：非 merge 提交为 Conventional Commits，且每个
              提交都带 DCO Signed-off-by trailer
            - 测试覆盖是否充分（解析、状态迁移、请求编码）
            - 是否混入了不适合提交到仓库的内容（本地绝对路径、测试用真实
              token/密钥、xcuserdata 等个人 Xcode 状态）
            - 是否擅自改动 bundle id、entitlements、App Group、签名、部署目标
              等敏感工程设置（若有则需人工审核）
            - 是否保留了既有的中文用户可见文案（除非任务明确要改）
            - 最终返回的 PR Comment 必须使用中文输出！！

            审查结论会自动显示在 track_progress 生成的追踪评论中，
            不要再用 `gh pr comment` 单独发一条顶层评论（会造成重复）。
            如需对具体代码行给出行内评论，
            用 `mcp__github_inline_comment__create_inline_comment`（并带上 `confirmed: true`）。
            只报告值得处理的问题，不要泛泛的赞美或吹毛求疵；没有问题就简短说明审查通过。

          # 授权行内评论工具，以及只读的 diff/view 用于收集上下文。
          # 不授权 gh pr comment：结论由 track_progress 的追踪评论承载。
          # git log/show/diff 只读，便于查看提交历史与具体改动。
          # 不在 CI 里放行 xcodebuild：iOS 构建需要 macOS runner 且很慢，
          # 审查阶段以静态阅读 diff 为主。
          claude_args: |
            --allowedTools "Task,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"
