name: CI

# 持续集成：每次 push 到 main/dev 以及所有 PR 都会用 xcodebuild 编译并跑单元测试。
# 这是 iOS 项目，必须用 macOS runner。
#
# job 名 "Build and test" 与后端仓库保持一致：仓库公开后启用分支保护时，必过
# 检查名可以直接对上。concurrency 取消同分支的旧运行是常规好习惯（新推送让旧
# 运行失去意义），与省不省额度无关。

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# 同一分支的新推送会取消尚未跑完的旧运行，省 macOS 分钟。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-latest
    env:
      PROJECT: amdl-ios.xcodeproj
      SCHEME: amdl-ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          echo "--- 可用 iOS 运行时 ---"
          xcrun simctl list runtimes | grep -i ios || true

      - name: Pick an available iOS Simulator
        id: sim
        # AGENTS.md 指定的 iPhone 17 Pro / iOS 26.x 在 GitHub runner 上不一定
        # 存在，这里动态挑一个已安装的 iPhone 模拟器；挑不到就回退到 generic
        # 目标（此时只编译、不跑测试，保证 CI 至少能验证编译通过）。
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; devs=json.load(sys.stdin)["devices"]; cands=[d for rt,ds in devs.items() if "iOS" in rt for d in ds if "iPhone" in d["name"]]; print(cands[0]["udid"] if cands else "")')
          if [ -n "$UDID" ]; then
            echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
            echo "generic=false" >> "$GITHUB_OUTPUT"
            echo "使用模拟器 udid: $UDID"
          else
            echo "destination=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
            echo "generic=true" >> "$GITHUB_OUTPUT"
            echo "未找到可用 iPhone 模拟器，回退到 generic（仅编译）"
          fi

      - name: Build and test
        run: |
          set -o pipefail
          COMMON=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration Debug
            -destination "${{ steps.sim.outputs.destination }}"
            CODE_SIGNING_ALLOWED=NO
          )
          if [ "${{ steps.sim.outputs.generic }}" = "true" ]; then
            xcodebuild "${COMMON[@]}" build
          else
            xcodebuild "${COMMON[@]}" -only-testing:amdl-iosTests test
          fi
